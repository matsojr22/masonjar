<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../css/style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../css/theme.css" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/; style-src 'self' https://fonts.googleapis.com https://cdn.jsdelivr.net/; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:;"
    />
    <title>Cell Detection — Mason Jar</title>
  </head>
  <body class="wizard-page">
    <div class="container py-4 workspace-block text-start">
      <h1>Cell Detection</h1>
      <p class="text-muted">
        Do you already know the detection parameters you want to apply globally to your images?
      </p>
      <div class="form-check mb-2">
        <input class="form-check-input" type="checkbox" id="manualChoice" />
        <label class="form-check-label" for="manualChoice">
          Yes, I want to proceed with manually assigning the detection parameters.
        </label>
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="exploreChoice" />
        <label class="form-check-label" for="exploreChoice">
          No, I would like to run tests and explore the detection parameters on this dataset.
        </label>
      </div>
      <a class="btn btn-outline-secondary" id="choiceBack" href="./menu_category.html?cat=detection">Back</a>
      <button type="button" class="btn btn-primary ms-2" id="choiceProceed" disabled>Proceed</button>
    </div>
    <script src="../js/run.js" data-entry="detect_start.js"></script>
  </body>
</html>
