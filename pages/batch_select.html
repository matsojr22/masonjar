<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../css/style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../css/theme.css" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/; style-src 'self' https://fonts.googleapis.com https://cdn.jsdelivr.net/; font-src 'self' https://fonts.gstatic.com;"
    />
    <title>Mason Jar — Batch</title>
  </head>
  <body>
    <div class="container py-3">
      <p class="text-muted mb-1"><a href="./menu.html">Menu</a> / Batch</p>
      <h1>Batch — select projects &amp; steps</h1>

      <div class="batch-layout my-3">
        <div class="batch-panel">
          <h5>Projects</h5>
          <div id="projectList" class="batch-project-list mb-2"></div>
          <div class="d-flex flex-wrap gap-2">
            <button type="button" class="btn btn-sm btn-outline-primary" id="addProject">
              Add project bundle…
            </button>
            <button type="button" class="btn btn-sm btn-outline-secondary" id="scanFolder">
              Scan folder for bundles
            </button>
          </div>
        </div>
        <div class="batch-panel">
          <h5>Steps</h5>
          <div id="stepList"></div>
          <p class="batch-align-note mt-3">
            Align Sections and Viewer/Editor must be completed manually per brain.
            Batch can run preprocessing and downstream analysis only when required
            folders and annotation files already exist.
          </p>
        </div>
      </div>

      <div id="preflightWarnings" class="alert alert-warning d-none small"></div>

      <div class="d-flex justify-content-between mt-3">
        <a class="btn btn-warning" href="./menu.html">Back</a>
        <button type="button" class="btn btn-primary" id="nextParams" disabled>
          Next: Parameters
        </button>
      </div>
    </div>
    <script src="../js/run.js" data-entry="batch_registry.js,project.js,batch_select.js"></script>
  </body>
</html>
