<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../css/style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../css/theme.css" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/; style-src 'self' https://fonts.googleapis.com https://cdn.jsdelivr.net/; font-src 'self' https://fonts.gstatic.com;"
    />
    <meta
      http-equiv="X-Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/; style-src 'self' https://fonts.googleapis.com https://cdn.jsdelivr.net/; font-src 'self' https://fonts.gstatic.com;"
    />
    <title>User guide — Mason Jar</title>
    <style>
      .user-guide-body {
        max-width: 52rem;
      }
      .user-guide-body h1 {
        font-size: 1.75rem;
      }
      .user-guide-body h2 {
        font-size: 1.35rem;
        margin-top: 2rem;
      }
      .user-guide-body h3 {
        font-size: 1.1rem;
        margin-top: 1.25rem;
      }
      .user-guide-toc ol {
        columns: 2;
        padding-left: 1.2rem;
      }
      .user-guide-code {
        white-space: pre-wrap;
        background: var(--mj-surface-2, #f7f5ee);
        border: 1px solid var(--mj-border, #ccc);
        border-radius: 0.375rem;
        padding: 0.75rem;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <div id="parent" class="container py-4">
      <div id="guide-root" class="user-guide-body text-start"></div>
      <p id="guide-error" class="text-danger d-none"></p>
      <div class="row mt-4">
        <div class="col d-grid" style="max-width: 52rem">
          <a role="button" class="btn btn-primary" href="./menu.html">Back</a>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
      crossorigin="anonymous"
    ></script>
    <script src="../js/user_guide_page.js"></script>
  </body>
</html>
