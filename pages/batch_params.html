<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../css/style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../css/theme.css" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/; style-src 'self' https://fonts.googleapis.com https://cdn.jsdelivr.net/; font-src 'self' https://fonts.gstatic.com;"
    />
    <title>Mason Jar — Batch parameters</title>
  </head>
  <body>
    <div class="container py-3">
      <p class="text-muted mb-1">
        <a href="./menu.html">Menu</a> / <a href="./batch_select.html">Batch</a> / Parameters
      </p>
      <h1>Batch — parameters</h1>
      <p class="small text-muted">Defaults apply to all selected projects in this run.</p>

      <div id="preflightWarnings" class="alert alert-warning d-none small"></div>
      <div id="paramSections" class="accordion my-3"></div>

      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="saveDefaults" />
        <label class="form-check-label" for="saveDefaults">Save as default for future batches</label>
      </div>

      <div class="d-flex justify-content-between">
        <a class="btn btn-warning" href="./batch_select.html">Back</a>
        <button type="button" class="btn btn-primary" id="nextRun">Next: Run</button>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
      crossorigin="anonymous"
    ></script>
    <script src="../js/run.js" data-entry="batch_registry.js,project.js,batch_params.js"></script>
  </body>
</html>
