<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../css/style.css" />
    <link
      rel="stylesheet"
      href="../node_modules/@fortawesome/fontawesome-free/css/all.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../css/theme.css" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/; style-src 'self' https://fonts.googleapis.com https://cdn.jsdelivr.net/; font-src 'self' https://fonts.gstatic.com;"
    />
    <title>Workspace — Mason Jar</title>
  </head>
  <body class="menu-page">
    <div id="parent" class="container menu-shell">
      <nav id="navTrail" class="nav-trail-wrap text-muted small mb-2" aria-label="Breadcrumb"></nav>
      <header class="menu-hero text-center">
        <h1 class="h3 menu-hero-title">Pipeline</h1>
        <p class="menu-hero-subtitle">Choose a pipeline stage to continue.</p>
        <div id="projectChip" class="menu-project-chip d-none"></div>
      </header>

      <section
        id="projectSubsetSection"
        class="menu-pipeline-section mb-4 d-none workspace-block text-start"
        aria-label="Processing subset"
      >
        <h2 class="h6 text-muted mb-2">Processing subset (project)</h2>
        <div class="form-check mb-2">
          <input class="form-check-input" type="checkbox" id="subsetEnabled" />
          <label class="form-check-label" for="subsetEnabled">
            Process only a subset of sections
          </label>
        </div>
        <div id="subsetSliceList" class="border rounded p-2 mb-2 d-none" style="max-height: 200px; overflow: auto"></div>
        <div class="d-flex flex-wrap gap-2">
          <button type="button" class="btn btn-sm btn-outline-secondary d-none" id="rescanProject">
            Rescan project files
          </button>
          <button type="button" class="btn btn-sm btn-outline-secondary d-none" id="addFilesToRole">
            Add files to role…
          </button>
        </div>
      </section>

      <section
        id="projectActiveRunsSection"
        class="menu-pipeline-section mb-4 d-none workspace-block text-start"
        aria-label="Completed tasks"
      ></section>

      <section class="menu-pipeline-section mb-4" aria-label="Pipeline tools">
        <div id="pipelineGrid" class="menu-grid menu-categories">
          <a
            class="menu-card menu-card-pipeline"
            data-cat="preprocess"
            href="./menu_category.html?cat=preprocess"
          >
            <i class="fas fa-layer-group menu-card-icon" aria-hidden="true"></i>
            <span class="menu-card-title">Image preprocessing</span>
            <span class="menu-card-sub">Max projection, Sharpen</span>
          </a>
          <a
            class="menu-card menu-card-pipeline"
            data-cat="alignment"
            href="./menu_category.html?cat=alignment"
          >
            <i class="fas fa-crosshairs menu-card-icon" aria-hidden="true"></i>
            <span class="menu-card-title">Atlas alignment</span>
            <span class="menu-card-sub">Align sections, Viewer/Editor</span>
          </a>
          <a
            class="menu-card menu-card-pipeline"
            data-cat="detection"
            href="./menu_category.html?cat=detection"
          >
            <i class="fas fa-brain menu-card-icon" aria-hidden="true"></i>
            <span class="menu-card-title">Cell detection</span>
            <span class="menu-card-sub">Detection, Count, Collate</span>
          </a>
          <a
            class="menu-card menu-card-pipeline"
            data-cat="exports"
            href="./menu_category.html?cat=exports"
          >
            <i class="fas fa-file-export menu-card-icon" aria-hidden="true"></i>
            <span class="menu-card-title">Image &amp; atlas exports</span>
            <span class="menu-card-sub">Isolate regions, Dual-channel TIFs</span>
          </a>
        </div>
      </section>

      <div class="d-grid gap-2 d-sm-flex justify-content-center">
        <a class="btn btn-warning" href="./menu.html">Back to start</a>
        <button type="button" class="btn btn-outline-secondary" id="toggleAppLog">
          Application log
        </button>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
      crossorigin="anonymous"
    ></script>
    <script src="../js/run.js" data-entry="workspace_menu.js"></script>
  </body>
</html>
